name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check skill frontmatter and README index
        run: python .github/scripts/validate_skills.py

      - name: Byte-compile bundled scripts
        run: python -m compileall -q .claude/skills
