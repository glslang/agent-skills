version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # CI tooling only (.github/requirements.txt). The skills' own bundled scripts
  # are stdlib-only and have no manifest, so nothing else here is tracked.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      ci-tooling:
        patterns:
          - "*"
